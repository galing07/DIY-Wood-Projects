<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Page Not Available</title>

<meta name="robots"
      content="noindex,nofollow">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    min-height: 100%;
}

body {

    background:
        #f7f4ef;

    color:
        #2d2925;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        20px;
}

.container {

    width: 100%;

    max-width:
        520px;

    background:
        #ffffff;

    border:
        1px solid #e6dfd6;

    border-radius:
        16px;

    padding:
        35px 25px;

    text-align:
        center;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.08);
}

.icon {

    width:
        64px;

    height:
        64px;

    margin:
        0 auto 20px;

    border-radius:
        50%;

    background:
        #f1e7da;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        30px;
}

h1 {

    margin:
        0 0 12px;

    font-size:
        25px;

    line-height:
        1.3;
}

p {

    margin:
        0;

    color:
        #666;

    font-size:
        14px;

    line-height:
        1.7;
}

.button {

    display:
        inline-block;

    margin-top:
        24px;

    padding:
        13px 24px;

    border-radius:
        10px;

    background:
        #2b59ff;

    color:
        #ffffff;

    text-decoration:
        none;

    font-weight:
        700;

    font-size:
        14px;

    transition:
        opacity .2s ease;
}

.button:hover {

    opacity:
        .88;
}

.small {

    margin-top:
        20px;

    font-size:
        11px;

    color:
        #999;
}

</style>

</head>


<body>


<div class="container">


    <div class="icon">
        !
    </div>


    <h1>
        Page Not Available
    </h1>

    </p>


    <a
        class="button"
        href="/">

        Back to DIY Wood Projects

    </a>


    <p class="small">

        DIY Wood Projects

    </p>


</div>


</body>

</html>
